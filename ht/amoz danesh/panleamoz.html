<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#e65100">
  <title>تکمیل اطلاعات مدیر - آموزیار</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="screen active" style="padding-top:40px;">
    <div class="header">
      <h1 style="color:#e65100;">تکمیل اطلاعات مدیر</h1>
      <p class="subtitle">اطلاعات مدرسه خود را وارد کنید</p>
    </div>

    <div class="card">
      <label>کد ملی</label>
      <input type="tel" id="national-id" placeholder="کد ملی ۱۰ رقمی" maxlength="10" inputmode="numeric">

      <label>شماره موبایل</label>
      <input type="tel" id="pm-phone" placeholder="09xxxxxxxxx" maxlength="11" inputmode="numeric">

      <label>نام و نام خانوادگی</label>
      <input type="text" id="pm-name" placeholder="نام کامل">

      <label>استان</label>
      <input type="text" id="pm-province" placeholder="مثال: تهران">

      <label>شهر</label>
      <input type="text" id="pm-city" placeholder="مثال: تهران">

      <label>نام مدرسه</label>
      <input type="text" id="pm-school" placeholder="مثال: دبیرستان شهید بهشتی">

      <label>ناحیه</label>
      <input type="text" id="pm-district" placeholder="مثال: ناحیه ۳">

      <div class="error" id="error-panel"></div>

      <button class="btn" id="btn-panel"
              style="background: linear-gradient(135deg, #e65100, #bf360c);"
              onclick="submitManagerPanel()">تأیید و ورود</button>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="panel.js"></script>
</body>
</html>
