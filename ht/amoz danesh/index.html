<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d47a1">
  <title>آموزیار</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="screen-loading" class="screen active"></div>

<div id="screen-login" class="screen">
  <div class="header"><h1>آموزیار</h1><p class="subtitle">ورود / ثبت‌نام</p></div>
  <div class="card">
    <label>شماره موبایل</label>
    <input type="tel" id="phone" placeholder="09xxxxxxxxx" maxlength="11" inputmode="numeric">
    <div class="error" id="error-phone"></div>
    <button class="btn" id="btn-phone" onclick="goLogin()">ادامه</button>
  </div>
</div>

<div id="screen-password" class="screen">
  <div class="header"><h1>ورود به حساب</h1><p class="subtitle" id="phone-show"></p></div>
  <div class="card">
    <label>رمز عبور</label>
    <input type="password" id="password-input" placeholder="رمز عبور">
    <div class="error" id="error-password"></div>
    <button class="btn" id="btn-password" onclick="doLogin()">تأیید و ورود</button>
  </div>
  <a href="#" class="back-link" onclick="showScreen('login')">تغییر شماره</a>
</div>

<div id="screen-verify" class="screen">
  <div class="header"><h1>تأیید شماره</h1><p class="subtitle">کد ۴ رقمی به شماره شما ارسال شد</p></div>
  <div class="card">
    <div class="code-display" id="code-display">----</div>
    <p class="code-hint">این کد تا پایان ثبت‌نام معتبر است</p>
    <label>کد تأیید</label>
    <input type="tel" id="code-input" placeholder="••••" maxlength="4" inputmode="numeric" autocomplete="off"
           onpaste="return false" oncopy="return false" oncut="return false" oncontextmenu="return false">
    <div class="error" id="error-code"></div>
    <button class="btn" onclick="verifyCode()">تأیید کد</button>
  </div>
  <a href="#" class="back-link" onclick="showScreen('login')">بازگشت</a>
</div>

<div id="screen-profile" class="screen">
  <div class="header"><h1>ساخت پروفایل</h1><p class="subtitle">اطلاعات خود را وارد کنید</p></div>
  <div class="card">
    <div class="avatar-section">
      <div class="avatar" id="avatar-preview" onclick="document.getElementById('file-input').click()"><span>انتخاب عکس</span></div>
      <input type="file" id="file-input" accept="image/*" onchange="previewAvatar(event)">
    </div>
    <label>نام و نام خانوادگی</label>
    <input type="text" id="name-input" placeholder="نام کامل">
    <label>رمز عبور</label>
    <input type="password" id="pass1" placeholder="حداقل ۶ کاراکتر">
    <label>تکرار رمز عبور</label>
    <input type="password" id="pass2" placeholder="تکرار رمز">
    <div class="error" id="error-profile"></div>
    <button class="btn" onclick="saveProfile()">ادامه</button>
  </div>
</div>

<div id="screen-school" class="screen">
  <div class="header"><h1>اطلاعات مدرسه</h1><p class="subtitle">اطلاعات خود را وارد کنید</p></div>
  <div class="card">
    <label class="checkbox-row" style="cursor:pointer;">
      <input type="checkbox" id="is-manager" onchange="toggleManager()">
      <span>من مدیر مدرسه هستم</span>
    </label>
    <div class="manager-box" id="manager-box">
      <label>رمز مدیر</label>
      <input type="password" id="manager-pass" placeholder="رمز مدیر">
    </div>
    <div id="school-fields">
      <label>استان</label>
      <input type="text" id="province" placeholder="مثال: تهران">
      <label>نام مدرسه</label>
      <input type="text" id="school" placeholder="نام مدرسه">
      <label>پایه / کلاس</label>
      <input type="text" id="grade" placeholder="مثال: دهم ریاضی">
    </div>
    <label class="checkbox-row" style="cursor:pointer;">
      <input type="checkbox" id="is-teacher" onchange="toggleTeacher()">
      <span>من معلم هستم</span>
    </label>
    <div class="teacher-box" id="teacher-box">
      <label>رمز معلم</label>
      <input type="password" id="teacher-pass" placeholder="رمز معلم">
    </div>
    <label class="checkbox-row" style="cursor:pointer;">
      <input type="checkbox" id="is-vice" onchange="toggleVice()">
      <span>من معاون هستم</span>
    </label>
    <div class="teacher-box" id="vice-box" style="display:none;">
      <label>رمز معاون</label>
      <input type="password" id="vice-pass" placeholder="رمز معاون">
    </div>
    <div class="error" id="error-school"></div>
    <button class="btn" id="btn-finish" onclick="finishRegister()">تأیید و ورود</button>
  </div>
</div>

<script src="api.js"></script>
<script src="script.js"></script>
</body>
</html>
